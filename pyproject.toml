[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.1.0"
description = "Evidence-grounded autonomous AI investigation and reasoning platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]